# Save this as .github/workflows/snake.yml in your YOUR_USERNAME/YOUR_USERNAME repo.
# It regenerates the contribution snake daily and pushes it to an "output" branch,
# which the README loads from. After committing, run it once manually from the
# Actions tab so the SVGs exist right away.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab
  push:
    branches:
      - main # change to master if that's your default branch

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
